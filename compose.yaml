name: enterprise-ai-knowledge-assistant

x-app-image: &app_image enterprise-ai-knowledge-assistant-backend:latest
x-app-build: &app_build
  context: .
  dockerfile: Dockerfile
  target: runtime
x-app-env-file: &app_env_file
  - path: .env
    required: false
x-app-environment: &app_environment
  APP_ENV: ${APP_ENV:-development}
  APP_DEBUG: ${APP_DEBUG:-false}
  DEBUG: ${DEBUG:-false}
  API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-change-me-for-local-development}@postgres:5432/${POSTGRES_DB:-enterprise_ai}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
  LOCAL_STORAGE_PATH: /app/data/uploads
  EMBEDDING_MODEL_CACHE_PATH: /app/data/models
  HF_HOME: /app/data/models/huggingface
  SENTENCE_TRANSFORMERS_HOME: /app/data/models/sentence-transformers
  LLM_ENABLED: ${LLM_ENABLED:-false}
x-default-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    logging: *default_logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend
    logging: *default_logging

  migration:
    image: *app_image
    build: *app_build
    restart: "no"
    env_file: *app_env_file
    environment: *app_environment
    command: ["alembic", "upgrade", "head"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    logging: *default_logging

  api:
    image: *app_image
    build: *app_build
    restart: unless-stopped
    env_file: *app_env_file
    environment: *app_environment
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads_data:/app/data/uploads
      - model_cache:/app/data/models
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - backend
    logging: *default_logging

  worker:
    image: *app_image
    build: *app_build
    restart: unless-stopped
    env_file: *app_env_file
    environment: *app_environment
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=default,documents
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-1}
      - --hostname=worker@%h
    security_opt:
      - no-new-privileges:true
    volumes:
      - uploads_data:/app/data/uploads
      - model_cache:/app/data/models
    healthcheck:
      test:
        - CMD-SHELL
        - "celery -A app.workers.celery_app:celery_app inspect ping -d worker@$$(hostname) --timeout=10 | grep -q pong"
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - backend
    logging: *default_logging

  frontend:
    profiles: ["frontend"]
    image: enterprise-ai-knowledge-assistant-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
        VITE_APP_NAME: ${VITE_APP_NAME:-Enterprise AI Knowledge Assistant}
    restart: unless-stopped
    environment:
      PORT: 8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    logging: *default_logging
  test:
    profiles: ["test"]
    image: enterprise-ai-knowledge-assistant-backend-test:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    restart: "no"
    env_file: *app_env_file
    environment: *app_environment
    command: ["python", "-m", "pytest", "tests/unit", "-v"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - backend
    logging: *default_logging

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  model_cache:

networks:
  backend:
    driver: bridge



