# Single-host frontend (DEMO.md): the built SPA, with /api/ and /health/ proxied to the API on
# the same origin, so the browser needs no CORS.
# A template: the nginx image's entrypoint fills ${FRONTEND_SERVER_NAMES} at start (only that
# variable, NGINX_ENVSUBST_FILTER in the Dockerfile).

# TC-SEC-08: a Host that is not one of the names below gets no answer at all (444), so nothing
# is ever built from a forged Host.
server {
    listen 8080 default_server;
    server_name _;
    return 444;
}

server {
    listen 8080;
    # FRONTEND_SERVER_NAMES: the deployment's own host names, space-separated (empty by default);
    # each one must also be in the API's TRUSTED_HOSTS.
    server_name localhost 127.0.0.1 ${FRONTEND_SERVER_NAMES};
    absolute_redirect off;  # TC-SEC-08: a redirect names the path only, never a host or port
    root /usr/share/nginx/html;
    client_max_body_size 25m;  # MAX_UPLOAD_SIZE_MB

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;  # only a name of server_name above gets here
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # The chat stream is SSE: pass each event on at once, never buffer or compress it.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;  # SPA routes fall back to the app
    }

    # A rebuilt app must not run against a cached index.html that names old asset files.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
