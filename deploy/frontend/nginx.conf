# Single-host frontend (DEMO.md): the built SPA, with /api/ and /health/ proxied to the API on
# the same origin, so the browser needs no CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;  # MAX_UPLOAD_SIZE_MB

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;  # 127.0.0.1 or localhost, both in TRUSTED_HOSTS
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # The chat stream is SSE: pass each event on at once, never buffer or compress it.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /health/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;  # SPA routes fall back to the app
    }

    # A rebuilt app must not run against a cached index.html that names old asset files.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
