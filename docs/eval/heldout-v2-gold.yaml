# Held-out v2, batch 1: gold. Status: DRAFT, waiting for the owner's review in heldout-v2-review.md.
# Questions come from heldout-v2-questions.yaml (frozen); scripts/eval/heldout_v2_check.py refuses a
# question that differs. Gold is written from the source PDFs of uat/corpus-v2/manifest.json only,
# without running the system. The check verifies every source_excerpt against the stated PDF page.
# gold_status: ANSWERED | NO_ANSWER | ANSWERED_LIMITED.
# gold_answer: required points, one per asked point. missing_points: what the documents do not say.
# ANSWERED_LIMITED has both. NO_ANSWER has missing_points only.
version: heldout-v2-batch1
status: DRAFT
corpus_version: "2.0.0"
restricted_forbidden: &restricted
  - {type: document, value: "UAT-GROUNDING-001"}
  - {type: title, value: "UAT Grounding Handbook"}
  - {type: content, value: "UAT travel approval policy"}
  - {type: content, value: "manager approval before booking travel"}
items:
  - id: HO2-001
    role: staff
    language: vi
    question: "Thời gian bắt đầu làm việc là bao nhiêu? Nghỉ trưa được mấy tiếng? Và mấy giờ tan làm?"
    gold_status: ANSWERED
    gold_answer:
      - "Bắt đầu làm việc: khung linh hoạt 08:00 - 09:00."
      - "Nghỉ trưa: 60 phút (1 tiếng), thông thường 12:00 - 13:00."
      - "Tan làm: khung 17:00 - 18:00, tương ứng giờ bắt đầu để đủ 08 giờ/ngày."
    gold_optional:
      - "ND-HR-002 Điều 5 ghi khung tham chiếu 08:30-17:30, nghỉ trưa 12:00-13:00, linh hoạt bắt đầu 08:00-09:30."
      - "Bộ phận trực hoặc 24/7 có lịch ca riêng."
    gold_citations:
      - {document: ND-HR-003, pages: [4]}
    acceptable_extra_citations:
      - {document: ND-HR-002, pages: [5]}
    forbidden: *restricted
    source_excerpt:
      - {document: ND-HR-003, page: 4, text: "Tổng thời gian làm việc 08 giờ/ngày; 40 giờ/tuần Khung bắt đầu linh hoạt 08:00 - 09:00 Khung kết thúc tương ứng 17:00 - 18:00"}
      - {document: ND-HR-003, page: 4, text: "Nghỉ trưa tiêu chuẩn 60 phút, thông thường từ 12:00 - 13:00"}
      - {document: ND-HR-002, page: 5, text: "Khung giờ làm việc tham chiếu: 08:30-17:30; nghỉ trưa 12:00-13:00. Nhân viên linh hoạt có thể bắt đầu 08:00-09:30"}
    owner_decision: "Hai tài liệu khác nhau về giờ bắt đầu và kết thúc. Đề xuất: gold theo ND-HR-003 vì là chính sách chuyên đề và áp dụng muộn hơn (01/09/2026 so với 01/08/2026); câu trả lời nêu số của ND-HR-002 và trích ND-HR-002 vẫn đạt."
    notes: "Câu ghép 3 ý, mỗi ý một mục bắt buộc."

  - id: HO2-002
    role: staff
    language: vi
    question: "Có cần phải tăng ca không và tăng ca thì phải báo với ai để duyệt?"
    gold_status: ANSWERED
    gold_answer:
      - "Không mặc nhiên phải tăng ca: làm thêm giờ chỉ thực hiện khi có nhu cầu công việc, sự đồng ý của người lao động và phê duyệt theo quy trình, trừ trường hợp pháp luật quy định khác."
      - "Người duyệt: quản lý trực tiếp."
    gold_optional:
      - "Tình huống sự cố khẩn cấp được ghi nhận hồi tố theo quy trình incident."
      - "Nhân viên ghi nhận thời điểm bắt đầu/kết thúc và mã ticket/dự án hoặc lý do trên hệ thống."
    gold_citations:
      - {document: ND-HR-002, pages: [5]}
      - {document: ND-HR-003, pages: [10]}
    acceptable_extra_citations:
      - {document: ND-HR-003, pages: [8]}
      - {document: ND-HR-005, pages: [7]}
    forbidden: *restricted
    source_excerpt:
      - {document: ND-HR-002, page: 5, text: "Làm thêm giờ chỉ thực hiện khi có nhu cầu công việc, sự đồng ý của người lao động và phê duyệt theo quy trình, trừ trường hợp pháp luật quy định khác."}
      - {document: ND-HR-003, page: 10, text: "Quản lý trực tiếp Duyệt lịch, ngoại lệ, làm thêm"}
      - {document: ND-HR-003, page: 8, text: "Làm thêm giờ chỉ được ghi nhận khi có yêu cầu công việc thực tế và được phê duyệt theo thẩm quyền, trừ tình huống khẩn cấp thuộc trường hợp pháp luật cho phép."}
    notes: "Câu ghép 2 ý. ND-HR-003 trang 8 chỉ nói 'theo thẩm quyền'; tên vai trò nằm ở trang 10."

  - id: HO2-003
    role: staff
    language: vi
    question: "Tiền OT sẽ tính như nào nếu tôi làm sau giờ làm hành chính?"
    gold_status: ANSWERED
    gold_answer:
      - "Làm thêm vào ngày làm việc bình thường được trả ít nhất 150% đơn giá/tiền lương giờ thực trả của công việc đang làm."
    gold_optional:
      - "Làm việc ban đêm được trả thêm ít nhất 30%; làm thêm vào ban đêm còn trả thêm ít nhất 20%."
      - "Ngày nghỉ hằng tuần ít nhất 200%; ngày lễ, Tết ít nhất 300%."
      - "OT phải được yêu cầu/phê duyệt; thời gian tự nguyện làm thêm không có phê duyệt có thể không được ghi nhận."
    gold_citations:
      - {document: ND-HR-005, pages: [7]}
    forbidden: *restricted
    source_excerpt:
      - {document: ND-HR-005, page: 7, text: "Làm thêm ngày làm việc bình thường Ít nhất 150% đơn giá/tiền lương giờ thực trả của công việc đang làm."}
      - {document: ND-HR-005, page: 7, text: "Làm thêm vào ban đêm Ngoài tiền OT và khoản 30% ban đêm, còn trả thêm ít nhất 20% theo cơ sở pháp luật áp dụng."}
      - {document: ND-HR-005, page: 7, text: "OT phải được yêu cầu/phê duyệt theo ND-HR-003"}
    owner_decision: "Đề xuất chỉ bắt buộc mức 150%, vì câu hỏi nói 'sau giờ hành chính' mà không nói ban đêm hay điều kiện duyệt. Nếu muốn, có thể nâng điều kiện phê duyệt thành ý bắt buộc."
    notes: ""

  - id: HO2-004
    role: staff
    language: vi
    question: "Quy trình đăng ký nghỉ có phép?"
    gold_status: ANSWERED
    gold_answer:
      - "Nhân viên tạo yêu cầu trên HRM."
      - "Quản lý trực tiếp rà soát kế hoạch nguồn lực."
      - "HR kiểm tra số dư/hồ sơ đối với trường hợp cần kiểm soát, rồi hệ thống ghi trạng thái cuối cùng."
      - "Thời hạn đề nghị phép năm: 1-2 ngày trước ít nhất 02 ngày làm việc; 3-5 ngày trước ít nhất 05 ngày làm việc; trên 5 ngày trước ít nhất 10 ngày làm việc."
    gold_optional:
      - "Chỉ rời lịch làm việc sau khi yêu cầu ở trạng thái Approved, trừ tình huống khẩn cấp đã thông báo cho quản lý."
      - "Bàn giao trước kỳ nghỉ: cập nhật ticket/dự án, đầu mối thay thế, thiết lập trạng thái vắng mặt."
    gold_citations:
      - {document: ND-HR-004, pages: [9]}
    acceptable_extra_citations:
      - {document: ND-HR-004, pages: [6]}
      - {document: UAT-LEAVE-AUTHORITY-001, pages: [5]}
    forbidden: *restricted
    source_excerpt:
      - {document: ND-HR-004, page: 9, text: "Nhân viên tạo yêu cầu trên HRM -> quản lý trực tiếp rà soát kế hoạch nguồn lực -> HR kiểm tra số dư/hồ sơ đối với trường hợp cần kiểm soát -> hệ thống ghi trạng thái cuối cùng."}
      - {document: ND-HR-004, page: 9, text: "Phép năm 1-2 ngày Trước ít nhất 02 ngày làm việc Phép năm 3-5 ngày Trước ít nhất 05 ngày làm việc Phép năm trên 5 ngày Trước ít nhất 10 ngày làm việc"}
      - {document: ND-HR-004, page: 6, text: "Người lao động chỉ rời lịch làm việc sau khi yêu cầu ở trạng thái Approved, trừ tình huống khẩn cấp đã thông báo cho quản lý."}
      - {document: UAT-LEAVE-AUTHORITY-001, page: 4, text: "Người lao động nên đăng ký nghỉ phép năm trước ít nhất 03 ngày làm việc; nghỉ từ 05 ngày liên tục nên đăng ký trước ít nhất 10 ngày làm việc"}
    owner_decision: "UAT-LEAVE-AUTHORITY-001 trang 4 ghi thời hạn khác (ít nhất 03 ngày; từ 05 ngày liên tục ít nhất 10 ngày). Đây là tài liệu mẫu ghi 'CHƯA PHẢI VĂN BẢN BAN HÀNH' với [TÊN DOANH NGHIỆP]. Đề xuất: gold theo ND-HR-004; câu chỉ nêu thời hạn của tài liệu mẫu không đạt ý 4. 'Nghỉ có phép' được hiểu là phép năm."
    notes: ""

  - id: HO2-005
    role: staff
    language: vi
    question: "Phụ nữ mang thai thì được nghỉ 3 tháng có phép phải không?"
    gold_status: ANSWERED_LIMITED
    gold_answer:
      - "Đính chính: không xác nhận được. Tài liệu không có quy định phụ nữ mang thai được nghỉ 3 tháng."
      - "Thai sản không phải nghỉ phép: đây là chế độ nghỉ theo BHXH; quyền lợi và thời gian nghỉ khi sinh con thực hiện theo pháp luật hiện hành."
    missing_points:
      - "Số tháng nghỉ thai sản."
    gold_optional:
      - "HR hỗ trợ xác định hồ sơ, thời điểm nghỉ, quyền lợi BHXH và kế hoạch bàn giao."
      - "Khám thai/chăm sóc thai kỳ: đăng ký loại nghỉ tương ứng."
      - "Quản lý không được tự ý chuyển nghỉ thai sản thành nghỉ phép năm nếu người lao động đủ điều kiện hưởng chế độ khác."
    gold_citations:
      - {document: ND-HR-004, pages: [3, 8]}
    acceptable_extra_citations:
      - {document: UAT-LEAVE-AUTHORITY-001, pages: [4]}
    forbidden: *restricted
    source_excerpt:
      - {document: ND-HR-004, page: 3, text: "Nghỉ theo chế độ BHXH Ốm đau, chăm con ốm, thai sản và các trường hợp khác theo pháp luật BHXH."}
      - {document: ND-HR-004, page: 8, text: "Sinh con Lập kế hoạch bàn giao trước khi nghỉ nếu điều kiện cho phép; quyền lợi và thời gian nghỉ thực hiện theo pháp luật hiện hành."}
      - {document: ND-HR-004, page: 8, text: "Các chế độ thai sản thực hiện theo Luật Bảo hiểm xã hội 2024, Bộ luật Lao động và văn bản hướng dẫn có hiệu lực tại thời điểm phát sinh."}
    limited_pass: "Đạt khi câu trả lời (a) không xác nhận 3 tháng, (b) nói thai sản theo BHXH và pháp luật chứ không phải nghỉ phép, (c) không thêm số tháng nào từ ngoài tài liệu."
    fail_examples:
      - "Đúng, được nghỉ 3 tháng có phép."
      - "Không, được nghỉ 6 tháng."
    absent_keywords: ["3 tháng", "6 tháng"]
    owner_decision: "Tiền đề sai theo yêu cầu của bạn, nhưng PDF không nêu số tháng đúng. Con số 6 tháng là kiến thức ngoài PDF, nên đề xuất tính là KHÔNG ĐẠT nếu câu trả lời nêu số đó. Hai kết quả tìm thấy không liên quan: '3. Thăng chức' (ND-HR-005 trang 8) và 'không quá 06 tháng' về kỷ luật (ND-HR-002 trang 12)."
    notes: "Câu tiền đề sai."

