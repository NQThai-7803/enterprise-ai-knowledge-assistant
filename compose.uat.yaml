services:
  uat-llm:
    image: node:24-alpine
    working_dir: /workspace
    command: ["node", "frontend/tests/e2e-live/fake-openai-provider.mjs"]
    environment:
      PORT: "18080"
      FAKE_LLM_DELAY_MS: ${FAKE_LLM_DELAY_MS:-250}
    ports:
      - "127.0.0.1:${UAT_LLM_PORT:-18080}:18080"
    volumes:
      - .:/workspace:ro
    networks:
      - backend

  api:
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LLM_ENABLED: "true"
      LLM_PROVIDER: openai_compatible
      LLM_MODEL: uat-deterministic-model
      LLM_OPENAI_BASE_URL: http://uat-llm:18080/v1
      LLM_OPENAI_API_KEY: ${UAT_LLM_API_KEY:-uat-local-deterministic-token}
      MIN_RELEVANCE_SCORE: "0.0"
      HYBRID_SEMANTIC_MIN_RELEVANCE_SCORE: "0.0"
      RATE_LIMIT_LOGIN_REQUESTS: "100"
      RATE_LIMIT_CHAT_REQUESTS: "100"
      RATE_LIMIT_UPLOAD_REQUESTS: "100"
      RATE_LIMIT_FEEDBACK_REQUESTS: "100"
    depends_on:
      uat-llm:
        condition: service_started

  worker:
    environment:
      MIN_RELEVANCE_SCORE: "0.0"
      HYBRID_SEMANTIC_MIN_RELEVANCE_SCORE: "0.0"
