services:
  uat-llm:
    image: node:24-alpine
    working_dir: /workspace
    command: ["node", "frontend/tests/e2e-live/fake-openai-provider.mjs"]
    environment:
      PORT: "18080"
      FAKE_LLM_DELAY_MS: ${FAKE_LLM_DELAY_MS:-250}
    ports:
      - "127.0.0.1:${UAT_LLM_PORT:-18080}:18080"
    volumes:
      - .:/workspace:ro
    networks:
      - backend

  uat-seed:
    image: enterprise-ai-knowledge-assistant-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD:-change-me-for-local-development}@postgres:5432/${POSTGRES_DB:-enterprise_ai}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOCAL_STORAGE_PATH: /app/data/uploads
      EMBEDDING_MODEL_CACHE_PATH: /app/data/models
      HF_HOME: /app/data/models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/data/models/sentence-transformers
      LLM_ENABLED: "false"
      UAT_SEED_ENABLED: "true"
      UAT_ADMIN_PASSWORD: ${UAT_ADMIN_PASSWORD:-LocalUatAdmin!2026}
      UAT_MANAGER_PASSWORD: ${UAT_MANAGER_PASSWORD:-LocalUatManager!2026}
      UAT_STAFF_PASSWORD: ${UAT_STAFF_PASSWORD:-LocalUatStaff!2026}
    command: ["python", "-m", "app.scripts.seed_uat_data"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - uploads_data:/app/data/uploads
      - model_cache:/app/data/models
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - backend

  api:
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      LLM_ENABLED: "true"
      LLM_PROVIDER: openai_compatible
      LLM_MODEL: uat-deterministic-model
      LLM_OPENAI_BASE_URL: http://uat-llm:18080/v1
      LLM_OPENAI_API_KEY: ${UAT_LLM_API_KEY:-uat-local-deterministic-token}
      MIN_RELEVANCE_SCORE: "0.0"
      HYBRID_SEMANTIC_MIN_RELEVANCE_SCORE: "0.0"
      RATE_LIMIT_LOGIN_REQUESTS: "100"
      RATE_LIMIT_CHAT_REQUESTS: "100"
      RATE_LIMIT_UPLOAD_REQUESTS: "100"
      RATE_LIMIT_FEEDBACK_REQUESTS: "100"
    depends_on:
      uat-llm:
        condition: service_started
      uat-seed:
        condition: service_completed_successfully

  worker:
    environment:
      MIN_RELEVANCE_SCORE: "0.0"
      HYBRID_SEMANTIC_MIN_RELEVANCE_SCORE: "0.0"
    depends_on:
      uat-seed:
        condition: service_completed_successfully