name: enterprise-ai-task0353a

# Disposable candidate-only project. No service or volume from enterprise-ai-uat-v2
# is referenced here. Credentials are synthetic local test values only.
x-candidate-env: &candidate-env
  APP_ENV: test
  APP_DEBUG: "false"
  DEBUG: "false"
  SECRET_KEY: ci-task0353a-local-only-secret-key-000000000000000000000000
  DATABASE_URL: postgresql+asyncpg://task0353a:task0353a-local-only-password@postgres:5432/task0353a
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CELERY_TASK_DEFAULT_QUEUE: default
  CELERY_DOCUMENT_QUEUE: documents
  CELERY_WORKER_CONCURRENCY: "1"
  STORAGE_BACKEND: local
  LOCAL_STORAGE_PATH: /app/data/uploads
  EMBEDDING_MODEL_CACHE_PATH: /app/data/models
  EMBEDDING_MODEL_NAME: intfloat/multilingual-e5-small
  EMBEDDING_DIMENSIONS: "384"
  EMBEDDING_LOCAL_FILES_ONLY: "true"
  CHUNK_TARGET_TOKENS: "500"
  CHUNK_OVERLAP_TOKENS: "75"
  LLM_ENABLED: "true"
  LLM_PROVIDER: ollama
  LLM_OLLAMA_BASE_URL: http://host.docker.internal:11434
  LLM_OLLAMA_MODEL: qwen2.5:3b
  LLM_OLLAMA_NUM_CTX: "8192"
  LLM_TEMPERATURE: "0"
  LLM_MAX_OUTPUT_TOKENS: "512"
  LLM_TIMEOUT_SECONDS: "180"
  UAT_SEED_ENABLED: "false"

services:
  postgres:
    image: pgvector/pgvector:pg17
    pull_policy: never
    restart: "no"
    environment:
      POSTGRES_DB: task0353a
      POSTGRES_USER: task0353a
      POSTGRES_PASSWORD: task0353a-local-only-password
    ports:
      - "127.0.0.1:15435:5432"
    volumes:
      - task0353a_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task0353a -d task0353a"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [candidate]

  redis:
    image: redis:7-alpine
    pull_policy: never
    restart: "no"
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16385:6379"
    volumes:
      - task0353a_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [candidate]

  migration:
    image: enterprise-ai-knowledge-assistant-api:task0353a-20261013-3ae9c41f
    pull_policy: never
    restart: "no"
    environment: *candidate-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks: [candidate]

  api:
    image: enterprise-ai-knowledge-assistant-api:task0353a-20261013-3ae9c41f
    pull_policy: never
    restart: "no"
    environment: *candidate-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:18035:8000"
    volumes:
      - task0353a_uploads:/app/data/uploads
      - task0353a_model_cache:/app/data/models
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks: [candidate]

  worker:
    image: enterprise-ai-knowledge-assistant-worker:task0353a-20261013-3ae9c41f
    pull_policy: never
    restart: "no"
    environment: *candidate-env
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=default,documents
      - --concurrency=1
      - --hostname=worker@%h
    volumes:
      - task0353a_uploads:/app/data/uploads
      - task0353a_model_cache:/app/data/models
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d worker@$$(hostname) --timeout=10 | grep -q pong"]
      interval: 20s
      timeout: 15s
      retries: 8
      start_period: 20s
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    networks: [candidate]

volumes:
  task0353a_pg_data:
  task0353a_redis_data:
  task0353a_uploads:
  task0353a_model_cache:

networks:
  candidate:
    driver: bridge
