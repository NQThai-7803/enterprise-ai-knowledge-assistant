# Isolated UAT eval stack (scripts/eval/README.md).
# Layered on compose.yaml + compose.uat-corpus-v2.yaml + the repo .env (same config as V2),
# with its own project name and volumes, no published DB/Redis ports, the API on
# 127.0.0.1:18190, and the backend image given in P3D_BACKEND_IMAGE.
x-p3d-image: &p3d_image
  image: ${P3D_BACKEND_IMAGE:?}
  pull_policy: never

services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  migration:
    <<: *p3d_image
  uat-v2-accounts:
    <<: *p3d_image
  worker:
    <<: *p3d_image
  api:
    <<: *p3d_image
    ports: !override
      - "127.0.0.1:18190:8000"
    environment:
      # Eval runs are reproducible: greedy decoding and a fixed seed (PROMPT 3f).
      LLM_TEMPERATURE: "0"
      RAG_DETERMINISTIC_ROUTE_MODE: ${EVAL_DETERMINISTIC_ROUTE_MODE:-strict}
      RAG_REPAIR_AFTER_LLM_REFUSAL_ENABLED: ${EVAL_REPAIR_AFTER_LLM_REFUSAL:-false}
      RAG_ANSWER_UNIT_GUARD_ENABLED: ${EVAL_ANSWER_UNIT_GUARD:-true}
      RAG_RESELECT_REQUIRES_STRONG_SUPPORT_ENABLED: ${EVAL_RESELECT_STRONG_SUPPORT:-false}
      RAG_PARTIAL_REFUSAL_NO_ANSWER_ENABLED: ${EVAL_PARTIAL_REFUSAL_NO_ANSWER:-true}
      RAG_SHORT_ANSWER_QUESTION_TERMS_ENABLED: ${EVAL_SHORT_ANSWER_QUESTION_TERMS:-true}
      RAG_STRICT_OUTCOME_CUES_EXACT_ENABLED: ${EVAL_STRICT_OUTCOME_CUES_EXACT:-false}
      RAG_REFUSAL_PHRASES_EXTENDED_ENABLED: ${EVAL_REFUSAL_PHRASES_EXTENDED:-false}
      RAG_QUESTION_HEAD_IN_EVIDENCE_ENABLED: ${EVAL_QUESTION_HEAD_IN_EVIDENCE:-false}
      RAG_QUESTION_EVIDENCE_SIMILARITY_ENABLED: ${EVAL_QUESTION_EVIDENCE_SIMILARITY:-false}
      RAG_QUESTION_EVIDENCE_MIN_SIMILARITY: ${EVAL_QUESTION_EVIDENCE_MIN_SIMILARITY:-0.85}
      RAG_RESPONSIVENESS_CHECK_ENABLED: ${EVAL_RESPONSIVENESS:-false}
      RAG_RESPONSIVENESS_MIN_SIMILARITY: ${EVAL_RESPONSIVENESS_MIN:-0.0}
      RAG_NUMBER_NORMALIZATION_ENABLED: ${EVAL_NUMBER_NORMALIZATION:-false}
      RAG_COMPLETENESS_NUMBER_NORMALIZATION_ENABLED: ${EVAL_COMPLETENESS_NUMBERS:-true}
      RAG_KEEP_VALIDATED_FIRST_ANSWER_ENABLED: ${EVAL_KEEP_FIRST_ANSWER:-false}
      RAG_RETRY_MUST_KEEP_VALIDATED_VALUES_ENABLED: ${EVAL_RETRY_KEEPS_VALUES:-true}
      # PROMPT 6 ablations and rerankers (scripts/diagnostics/ablation_patches.py); inert by default.
      PYTHONPATH: /app/scripts/diagnostics/ablation_site:/app
      EVAL_ABLATION: ${EVAL_ABLATION:-}
      LLM_OLLAMA_MODEL: ${EVAL_LLM_MODEL:-qwen2.5:3b}
      EVAL_ORACLE_FILE: ${EVAL_ORACLE_FILE:-}
      RERANKER_MODEL: ${EVAL_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_MODEL_CACHE_PATH: ${EVAL_RERANKER_CACHE:-/app/data/models}
      RERANKER_TIMEOUT_SECONDS: ${EVAL_RERANKER_TIMEOUT:-10}
      LLM_SEED: ${EVAL_LLM_SEED:-20261031}
      RAG_RESTORE_SOURCE_DIACRITICS_ENABLED: ${EVAL_SOURCE_DIACRITICS:-true}
      RAG_DEDUPE_CLAIM_ANSWERS_ENABLED: ${EVAL_DEDUPE_CLAIMS:-true}
      # Point at scripts/eval/ollama_usage_proxy.py to record token usage per call.
      LLM_OLLAMA_BASE_URL: ${EVAL_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
