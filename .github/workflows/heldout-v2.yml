name: Held-out v2 release run

# Phase 3, DEC-012: the one held-out v2 measurement, at the release milestone, with the owner's
# approval. Prepared 2026-11-15 and NOT run during development.
#
# Refuses to start unless: it runs on main; `confirm` is typed exactly; the job is approved in the
# `heldout-v2-release` environment (add the owner as a required reviewer in the repository
# settings); and scripts/eval/heldout_v2_release.py `gate` passes (questions match their lock, gold
# locked with the owner's approval in docs/eval/heldout-v2-gold.lock).
#
# Runs the current defaults twice on corpus V2 (CPU, Ollama 0.40.15, qwen2.5:3b), then writes the
# owner's grading sheet (grading.md / grading.csv, labels left empty), split into "near UAT"
# (e5 >= 0.90 to a Q001-Q100 question) and the rest. Every sheet states DEC-022: the owner ran the
# 20 questions by hand on 2026-11-11, outside DEC-012.
# DEC-039: the artifact holds only the two locks and, on a GitHub-hosted runner, the age ciphertext
# of the results (repository variable HELDOUT_AGE_RECIPIENT; the job fails without it). On a
# self-hosted runner the results go to HELDOUT_PRIVATE_DIR/<run id> (default
# C:/dev/eaka-private/heldout-v2) and are not uploaded. Scanned before the upload.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type exactly: DEC-012 release run approved by the owner"
        type: string
        required: true
      preflight_only:
        description: "Only build the stack and run every check (gate, reranker, Ollama, logins); send no held-out question"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: heldout-v2-release
  cancel-in-progress: false

jobs:
  heldout-v2:
    name: Held-out v2 (2 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: heldout-v2-release
    env:
      PROJECT: eaka-heldout-v2
      OUT: heldout-v2-out
      PUBLIC: heldout-v2-public
      P3D_BACKEND_IMAGE: eaka-backend:ci-heldout-v2
      EVAL_EXPECTED_RERANKER_MODE: lexical_fallback
      COMPOSE_FILES: "-f compose.yaml -f compose.uat-corpus-v2.yaml -f scripts/eval/compose.uat-eval.yaml -f ci-host.yaml"
      OLLAMA_VERSION: 0.40.15
      EVAL_OLLAMA_EXPECTED_VERSION: 0.40.15
      EVAL_OLLAMA_EXPECTED_BACKEND: CPU
      EVAL_OLLAMA_BASE_URL: http://host.docker.internal:11434
      RAG_ACCEPTANCE_BASE_URL: http://127.0.0.1:18190
      PYTHONIOENCODING: utf-8
    steps:
      - name: Refuse anything but a confirmed run on main
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "held-out v2 runs only on main"; exit 1; }
          [ "$CONFIRM" = "DEC-012 release run approved by the owner" ] \
            || { echo "confirm text does not match"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install runner dependencies
        run: python -m pip install -e ".[dev]"

      - name: Gate (frozen questions, approved and locked gold)
        run: python scripts/eval/heldout_v2_release.py gate

      - name: Check where the owner's full results go (DEC-039)
        env:
          RUNNER_KIND: ${{ runner.environment }}
          HELDOUT_AGE_RECIPIENT: ${{ vars.HELDOUT_AGE_RECIPIENT }}
        run: |
          echo "runner: $RUNNER_KIND"
          if [ "$RUNNER_KIND" = github-hosted ]; then
            [[ "$HELDOUT_AGE_RECIPIENT" =~ ^age1[0-9a-z]{58}$ ]] || {
              echo "set the repository variable HELDOUT_AGE_RECIPIENT to the owner's age public key"
              exit 1
            }
            sudo apt-get update -qq && sudo apt-get install -y -qq age > /dev/null
            age --version
          fi

      - name: Generate throwaway credentials
        run: |
          for name in SECRET_KEY POSTGRES_PASSWORD UAT_ADMIN_PASSWORD UAT_MANAGER_PASSWORD UAT_STAFF_PASSWORD EVAL_PASSWORD_OPS; do
            value="Ci$(openssl rand -hex 16)!"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Write the app environment file
        # Same file as eval.yml; every RAG flag is left at the application default.
        run: |
          cat > .env <<EOF
          APP_ENV=development
          APP_DEBUG=false
          API_V1_PREFIX=/api/v1
          SECRET_KEY=${SECRET_KEY}
          JWT_ALGORITHM=HS256
          JWT_ISSUER=enterprise-ai-knowledge-assistant
          JWT_AUDIENCE=enterprise-ai-api
          ACCESS_TOKEN_EXPIRE_MINUTES=15
          REFRESH_TOKEN_EXPIRE_DAYS=7
          POSTGRES_DB=enterprise_ai
          POSTGRES_USER=app_user
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          STORAGE_BACKEND=local
          MAX_UPLOAD_SIZE_MB=25
          EMBEDDING_PROVIDER=sentence_transformers
          EMBEDDING_MODEL_NAME=intfloat/multilingual-e5-small
          EMBEDDING_DIMENSIONS=384
          EMBEDDING_DEVICE=cpu
          EMBEDDING_BATCH_SIZE=16
          EMBEDDING_NORMALIZE=true
          EMBEDDING_QUERY_PREFIX="query: "
          EMBEDDING_PASSAGE_PREFIX="passage: "
          EMBEDDING_LOCAL_FILES_ONLY=false
          RETRIEVAL_TOP_K=10
          RERANKER_TOP_K=6
          MIN_RELEVANCE_SCORE=0.50
          CHUNK_SIZE_TOKENS=700
          CHUNK_OVERLAP_TOKENS=100
          LLM_ENABLED=true
          LLM_PROVIDER=ollama
          LLM_OLLAMA_MODEL=qwen2.5:3b
          LLM_OLLAMA_NUM_CTX=8192
          LLM_OLLAMA_KEEP_ALIVE=10m
          LLM_MAX_OUTPUT_TOKENS=512
          LLM_OLLAMA_REASONING_EFFORT=none
          LLM_TIMEOUT_SECONDS=180
          LOG_LEVEL=INFO
          LOG_FORMAT=json
          RAG_DIAGNOSTICS_ENABLED=true
          EOF
          sed -i 's/^          //' .env
          echo "EVAL_PASSWORD_ADMIN=${UAT_ADMIN_PASSWORD}" >> "$GITHUB_ENV"
          echo "EVAL_PASSWORD_MANAGER=${UAT_MANAGER_PASSWORD}" >> "$GITHUB_ENV"
          echo "EVAL_PASSWORD_STAFF=${UAT_STAFF_PASSWORD}" >> "$GITHUB_ENV"

      - name: Install Ollama and pull the model
        run: |
          set -euo pipefail
          if ! { curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors \
                   -o "$RUNNER_TEMP/ollama-install.sh" https://ollama.com/install.sh \
                 && OLLAMA_VERSION="$OLLAMA_VERSION" sh "$RUNNER_TEMP/ollama-install.sh"; }; then
            docker create --name ollama-src "ollama/ollama:$OLLAMA_VERSION" >/dev/null
            sudo docker cp ollama-src:/usr/bin/ollama /usr/local/bin/ollama
            sudo mkdir -p /usr/local/lib
            sudo docker cp ollama-src:/usr/lib/ollama /usr/local/lib/ollama
            docker rm ollama-src >/dev/null
          fi
          ollama --version
          sudo systemctl stop ollama || true
          # DEC-014: the runner reads the backend from this log (run #1 failed without it).
          echo "EVAL_OLLAMA_LOG=$RUNNER_TEMP/ollama.log" >> "$GITHUB_ENV"
          # DEC-029: llama-server's prompt cache capped as in DEPLOYMENT.md (Ollama's own cap: 8 GiB).
          LLAMA_ARG_CACHE_RAM=2048 \
          OLLAMA_HOST=0.0.0.0:11434 OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_NUM_PARALLEL=1 \
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 2; done
          for attempt in 1 2 3; do ollama pull qwen2.5:3b && break; sleep 15; done
          ollama list | grep -q '^qwen2.5:3b'
          mkdir -p "$OUT"
          { ollama --version; nproc; free -m; } > "$OUT/ollama-config.txt"

      - name: Build the backend image
        run: docker build -t "$P3D_BACKEND_IMAGE" --label eaka.commit="${GITHUB_SHA::7}" .

      - name: Start the eval stack
        run: |
          set -euo pipefail
          cat > ci-host.yaml <<'EOF'
          services:
            api:
              extra_hosts: ["host.docker.internal:host-gateway"]
            worker:
              extra_hosts: ["host.docker.internal:host-gateway"]
          EOF
          read -r -a FILES <<< "$COMPOSE_FILES"
          docker compose -p "$PROJECT" "${FILES[@]}" up -d --wait --no-build postgres redis
          docker compose -p "$PROJECT" "${FILES[@]}" run --rm --no-deps migration
          docker compose -p "$PROJECT" "${FILES[@]}" run --rm --no-deps uat-v2-accounts
          docker compose -p "$PROJECT" "${FILES[@]}" up -d --no-build --no-deps api worker
          for _ in $(seq 1 90); do
            [ "$(docker inspect "$PROJECT-api-1" --format '{{.State.Health.Status}}')" = healthy ] && break
            sleep 5
          done
          docker inspect "$PROJECT-api-1" --format '{{.State.Health.Status}}' | grep -q healthy

      - name: Preflight (sends no held-out question)
        # The run's own checks, before the corpus load and the first question: gate, reranker
        # mode, Ollama version and backend (DEC-014), one login per role.
        run: |
          set -euo pipefail
          python scripts/eval/heldout_v2_release.py preflight 2>&1 | tee "$OUT/preflight.log"

      - name: Load corpus V2
        if: ${{ !inputs.preflight_only }}
        run: >
          python scripts/eval/bootstrap_corpus_v2.py . http://127.0.0.1:18190
          "$OUT/runtime-manifest.json"

      - name: Run held-out v2 twice
        if: ${{ !inputs.preflight_only }}
        run: |
          set -euo pipefail
          docker inspect "$PROJECT-api-1" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -E '^(RAG_|RERANKER_|LLM_OLLAMA_MODEL|LLM_SEED)' | sort > "$OUT/flags.txt"
          echo "commit=${GITHUB_SHA}" > "$OUT/commit.txt"
          ( while true; do free -m | awk 'NR==2 {print strftime("%T"), $3, $7}'; sleep 30; done ) \
            > "$OUT/memory.log" &
          for run in 1 2; do
            mkdir -p "$OUT/run$run"
            python scripts/eval/ollama_warmup.py "$OUT/run$run/warmup.json" \
              --base-url http://127.0.0.1:11434 --model qwen2.5:3b --num-ctx 8192 \
              --keep-alive 10m --seed 20261031 >/dev/null
            python scripts/eval/heldout_v2_release.py run \
              --output "$OUT/run$run/runtime_results.json" 2>&1 | tee "$OUT/run$run/runner.log"
          done

      - name: Group by nearness to UAT (e5)
        if: ${{ !inputs.preflight_only }}
        run: python scripts/eval/heldout_v2_release.py near-uat --output "$OUT/near-uat.json"

      - name: Write the owner's grading sheet (no labels)
        if: ${{ !inputs.preflight_only }}
        run: |
          python scripts/eval/heldout_v2_release.py grading "$OUT/run1" "$OUT/run2" "$OUT/grading" \
            --stack-manifest "$OUT/runtime-manifest.json" --near-uat "$OUT/near-uat.json"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$OUT"
          docker compose -p "$PROJECT" logs --no-color api worker > "$OUT/stack.log" 2>&1 || true
          cp "$RUNNER_TEMP/ollama.log" "$OUT/" 2>/dev/null || true
          docker compose -p "$PROJECT" down -v || true

      - name: Keep the full results private (DEC-039)
        id: private
        if: always()
        env:
          RUNNER_KIND: ${{ runner.environment }}
          HELDOUT_AGE_RECIPIENT: ${{ vars.HELDOUT_AGE_RECIPIENT }}
          HELDOUT_PRIVATE_DIR: ${{ vars.HELDOUT_PRIVATE_DIR }}
        run: >
          bash scripts/eval/heldout_publish.sh heldout-v2 "$OUT" "$PUBLIC" "$GITHUB_RUN_ID"
          docs/eval/heldout-v2-questions.lock docs/eval/heldout-v2-gold.lock

      - name: Scan the public folder for question text (DEC-039)
        id: scan
        if: always() && steps.private.outcome == 'success'
        run: |
          python scripts/eval/question_leak.py scan "$PUBLIC"
          if [ -f "$PUBLIC/summary.md" ]; then cat "$PUBLIC/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the public folder (ids, counts, verdict, lock, ciphertext only)
        if: always() && steps.private.outcome == 'success' && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: heldout-v2-${{ github.run_id }}
          path: heldout-v2-public/
          retention-days: 90
