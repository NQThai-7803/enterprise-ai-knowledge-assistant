    limited_pass: "Đính chính rằng Employee Referral Bonus là thưởng cho người giới thiệu khi ứng viên được tuyển hoàn thành thử việc, không phải thưởng cho ứng viên (có thể kèm mức 3 - 15 triệu đồng)."
    fail_examples:
