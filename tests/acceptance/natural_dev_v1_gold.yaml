      - {document: ND-HR-005, page: 9, text: "Employee Referral Bonus 3 - 15 triệu đồng Ứng viên được tuyển và hoàn thành mốc thử việc/điều kiện chương trình."}
    forbidden:
      - {document: UAT-GROUNDING-001, value: "travel approval"}
    notes: "Owner 2026-11-17: ANSWERED_LIMITED; thưởng giới thiệu dành cho người giới thiệu, đạt khi đính chính, FAIL nếu nói ứng viên nhận 3 - 15 triệu. Trang 9 xếp khoản này trong mục 'Hiệu suất, dự án, sáng kiến, giới thiệu và thưởng đặc biệt'."

