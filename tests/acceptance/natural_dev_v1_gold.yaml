    gold_answer:
      - "11 ngày nghỉ lễ, Tết trong năm, hưởng nguyên lương."
    gold_optional:
      - "Gồm Tết Dương lịch 01, Tết Âm lịch 05, Chiến thắng 30/4 01, Quốc tế Lao động 01/5 01, Quốc khánh 02, Giỗ Tổ Hùng Vương 01 ngày."
      - "Người lao động nước ngoài được nghỉ thêm 01 ngày Tết cổ truyền và 01 ngày Quốc khánh của nước họ."
      - "Lịch nghỉ cụ thể do HR/doanh nghiệp thông báo hằng năm."
    gold_citations:
      - {document: ND-HR-004, pages: [5]}
    source_excerpt:
      - {document: ND-HR-004, page: 5, text: "Tết Dương lịch 01 ngày Tết Âm lịch 05 ngày Ngày Chiến thắng 30/4 01 ngày Ngày Quốc tế Lao động 01/5 01 ngày Quốc khánh 02 ngày Giỗ Tổ Hùng Vương 01 ngày"}
    fail_examples:
      - "Một tổng khác 11 ngày."
      - "Cộng nghỉ hằng năm (12 ngày) vào nghỉ lễ."
    forbidden:
      - {document: UAT-GROUNDING-001, value: "travel approval"}
    notes: "ND-HR-004 liệt kê từng dịp, cộng lại 11 (01 + 05 + 01 + 01 + 02 + 01), nhưng không ghi tổng. Sửa ngày 2026-11-18 (DEC-033, owner duyệt): UAT-LEAVE-AUTHORITY-001 ghi tổng 11 nhưng là tài liệu mẫu (chưa phải văn bản ban hành), nên không còn là citation gold hay được chấp nhận; gold là bảng ND-HR-004 tr. 5."

  - id: ND-002
    question: "Tôi là ứng viên được tuyển và hoàn thành mốc thử việc thì được thưởng thêm gì không?"
