    near_uat_group: other  # e5 0.8657 to Q096
    gold_status: ANSWERED_LIMITED
    gold_answer:
      - "Đính chính: khoản thưởng gắn với việc ứng viên được tuyển và hoàn thành mốc thử việc là Employee Referral Bonus (thưởng giới thiệu, 3 - 15 triệu đồng), dành cho NGƯỜI GIỚI THIỆU ứng viên, không phải cho chính ứng viên."
      - "Tài liệu không nêu khoản thưởng nào cho chính ứng viên khi hoàn thành thử việc."
    missing_points:
