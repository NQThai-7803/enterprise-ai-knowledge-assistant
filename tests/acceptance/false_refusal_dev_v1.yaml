# False-refusal dev set (FIX 3 preparation). Synthetic documents and questions, for an isolated
# stack only, never the main corpus. Written without looking at any held-out question or gold.
# Group N: the answer is a number the model may write in another form than the source
#   ("01" / "1", "300.000 đồng" / "300 nghìn đồng", "5%" / "5 phần trăm").
# Group A: the question uses other words than the source for the same thing (low alignment).
# Each group also has questions that look alike but are not answered by the documents.
# fact: text the answer must hold; fact_alternatives: other accepted forms of the same value.
# Frozen by false_refusal_dev_v1.lock: any edit needs v1.1 and a new lock.
version: false_refusal_dev_v1
documents:
  - code: FRDEV-CTP-001
    title: Quy dinh cong tac phi trong nuoc
    scope: ORGANIZATION
    text: |
      CÔNG TY DỊCH VỤ KỸ THUẬT HÒA PHONG - TÀI LIỆU NỘI BỘ - Trang 1
      Quy định công tác phí trong nước.
      Phụ cấp lưu trú khi đi công tác trong nước là 300.000 đồng mỗi ngày.
      Nhân viên được tạm ứng tối đa 5.000.000 đồng cho mỗi chuyến công tác.
      Chứng từ thanh toán phải nộp trong 07 ngày làm việc sau khi kết thúc chuyến đi.
      Chuyến công tác dài hơn 03 ngày cần trưởng phòng phê duyệt trước khi khởi hành.
      Vé máy bay được thanh toán theo hạng phổ thông.
  - code: FRDEV-ATP-001
    title: Quy che an toan phong thi nghiem
    scope: ORGANIZATION
    text: |
      CÔNG TY DỊCH VỤ KỸ THUẬT HÒA PHONG - TÀI LIỆU NỘI BỘ - Trang 1
      Quy chế an toàn phòng thí nghiệm.
      Bình chữa cháy trong phòng thí nghiệm được kiểm tra 01 lần mỗi quý.
      Mỗi ca làm việc trong phòng thí nghiệm phải có tối thiểu 02 người.
      Kho hóa chất được giữ ở nhiệt độ dưới 25 độ C.
      Nhân viên mới phải hoàn thành 08 giờ huấn luyện an toàn trước khi vào phòng thí nghiệm.
      Kính bảo hộ là trang bị bắt buộc khi thao tác với hóa chất.
  - code: FRDEV-DTN-001
    title: Chinh sach ho tro dao tao
    scope: ORGANIZATION
    text: |
      CÔNG TY DỊCH VỤ KỸ THUẬT HÒA PHONG - TÀI LIỆU NỘI BỘ - Trang 1
      Chính sách hỗ trợ đào tạo bên ngoài.
      Công ty hỗ trợ 70% học phí, tối đa 20.000.000 đồng mỗi năm cho mỗi nhân viên.
      Khóa học có học phí trên 10.000.000 đồng yêu cầu cam kết làm việc thêm 12 tháng.
      Đơn đăng ký khóa học phải gửi phòng nhân sự trước ngày khai giảng ít nhất 15 ngày.
      Nhân viên đang trong thời gian thử việc chưa được hưởng chính sách này.
items:
